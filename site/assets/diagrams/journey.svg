<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc"><title id="title">From request through review</title><desc id="desc">Illustrative native workflow · blue surfaces mark owner decisions</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2455d6" stroke-width="1.5"/></marker></defs><rect width="1100" height="620" fill="#f8f5ef"/><text x="30" y="37" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600">From request through review</text>
<text x="30" y="61" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Illustrative native workflow · blue surfaces mark owner decisions</text>
<rect x="30" y="100" width="230" height="130" rx="5" fill="#fffdf9" stroke="#d4d9e0"/>
<text x="47" y="125" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">01 / EXPLICIT REQUEST</text>
<text x="47" y="153" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Give it a task</text>
<text x="47" y="179" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Slack or your coding tool</text>
<text x="47" y="198" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Project context + constraints</text>
<rect x="300" y="100" width="230" height="130" rx="5" fill="#eef1f8" stroke="#91a9dd"/>
<text x="317" y="125" fill="#2455d6" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">02 / OWNER DECISION</text>
<text x="317" y="153" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Approve the plan</text>
<text x="317" y="179" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Quick: one plan approval</text>
<text x="317" y="198" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Full: requirements → design → plan</text>
<rect x="570" y="100" width="230" height="130" rx="5" fill="#fffdf9" stroke="#d4d9e0"/>
<text x="587" y="125" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">03 / YOUR AWS ACCOUNT</text>
<text x="587" y="153" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Rovara Code at work</text>
<text x="587" y="179" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Prepared project workspace</text>
<text x="587" y="198" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Files and context for follow-ups</text>
<polyline points="260,165 298,165" fill="none" stroke="#2455d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="530,165 568,165" fill="none" stroke="#2455d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570" y="300" width="230" height="130" rx="5" fill="#fffdf9" stroke="#d4d9e0"/>
<text x="587" y="325" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">04 / CURRENT CANDIDATE</text>
<text x="587" y="353" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Checks + AI reviews</text>
<text x="587" y="379" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Named output + code reference</text>
<text x="587" y="398" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Reviews start after checks pass</text>
<polyline points="685,230 685,298" fill="none" stroke="#2455d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="300" width="230" height="130" rx="5" fill="#fffdf9" stroke="#d4d9e0"/>
<text x="317" y="325" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">05 / GITHUB</text>
<text x="317" y="353" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Draft PRs for review</text>
<text x="317" y="379" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Inspect the diff and repository CI</text>
<text x="317" y="398" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Track every required linked PR</text>
<polyline points="570,365 532,365" fill="none" stroke="#2455d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30" y="300" width="230" height="130" rx="5" fill="#eef1f8" stroke="#91a9dd"/>
<text x="47" y="325" fill="#2455d6" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">06 / OWNER DECISION</text>
<text x="47" y="353" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">Respond to feedback</text>
<text x="47" y="379" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Inspect proposed fixes</text>
<text x="47" y="398" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Approve selected changes</text>
<polyline points="300,365 262,365" fill="none" stroke="#2455d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="145,300 145,266 685,266 685,232" fill="none" stroke="#2455d6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="250" y="255" fill="#2455d6" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">Approved fixes repeat coding, checks and reviews</text>
<rect x="850" y="190" width="220" height="148" rx="5" fill="#eef1f8" stroke="#91a9dd"/>
<text x="867" y="215" fill="#2455d6" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="500">YOUR TEAM</text>
<text x="867" y="243" fill="#19212f" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600">The final merge</text>
<text x="867" y="269" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">Human review + repository rules</text>
<text x="867" y="288" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400">GitHub owns PR merge state</text>
<polyline points="530,416 825,416 825,265 848,265" fill="none" stroke="#2455d6" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="32" y="482" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">No silent follow-up coding. A feedback proposal needs the owner’s decision.</text>
<text x="32" y="514" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="400">A changed candidate needs fresh dependent evidence. Missing checks remain visible.</text>
<text x="32" y="558" fill="#4c596b" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="400">This explains the workflow. It is not a captured task or a claim of production delivery.</text></svg>
